<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Ultimate Dinosaur Rumble!</title>
    <link rel="icon" type="image/x-icon" href="/images/dino-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Slackey&family=Oswald:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>

    <div class="title">
      <h1>Ultimate Dinosaur Rumble</h1>
    </div>

    <div class="nav-links" style="margin-bottom: 8px;">
      <a class="nav-link" href="bracket.html">Try the Tournament Bracket →</a>
    </div>

    <div class="card">

      <p id="the-winner">Who will win?</p>

      <p class="choose">Select your Dinosaurs!</p>

      <div class="fighters">
        <select name="dinosaur-one" id="dinosaur-one" class="dropbtn"></select>
        <span class="versus">VS</span>
        <select name="dinosaur-two" id="dinosaur-two" class="dropbtn"></select>
      </div>

      <div class="buttons">
        <button class="button" id="winner-button">FIGHT!</button>
        <button class="button reset" onClick="window.location.reload()">RESET!</button>
      </div>

    </div>

    <script src="newdino.js"></script>

  </body>
</html>
