<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dino Tournament Bracket</title>
    <link rel="icon" type="image/x-icon" href="/images/dino-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Slackey&family=Oswald:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>

      /* --- Selection Phase --- */
      .selection-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        max-width: 700px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      }

      .selection-card h2 {
        font-family: 'Oswald', sans-serif;
        color: var(--text);
        margin: 0 0 6px;
        font-size: 1.2rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .selection-card p {
        color: var(--muted);
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        margin: 0 0 24px;
      }

      .dino-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 28px;
      }

      .pick-wrapper {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center;
      }

      .pick-wrapper label {
        color: var(--player);
        font-family: 'Oswald', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .dino-pick {
        width: 100%;
        font-size: 12px;
        padding: 8px 6px;
        max-width: none;
        min-width: unset;
      }

      /* --- Bracket Phase --- */
      #bracket-phase {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 1100px;
        padding: 0 12px;
        box-sizing: border-box;
      }

      .bracket-columns {
        display: flex;
        gap: 12px;
        width: 100%;
        height: 960px;
      }

      .round-col {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }

      .round-title {
        font-family: 'Oswald', sans-serif;
        color: var(--muted);
        font-size: 0.75rem;
        text-align: center;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
        flex-shrink: 0;
      }

      .col-inner {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        flex: 1;
        gap: 6px;
      }

      .match-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .dino-slot {
        background: rgba(255,255,255,0.04);
        border-radius: 6px;
        padding: 8px 6px;
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-size: 0.72rem;
        font-weight: 500;
        min-height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        line-height: 1.2;
      }

      .dino-slot.pending {
        color: var(--muted);
        font-style: italic;
      }

      .dino-slot.winner {
        background: var(--win);
        color: #fff;
        animation: winner-pop 0.35s ease 0.05s both;
      }

      .dino-slot.loser {
        background: rgba(239, 68, 68, 0.15);
        color: var(--muted);
        text-decoration: line-through;
      }

      .dino-slot.is-player:not(.winner):not(.loser):not(.pending) {
        border-left: 3px solid var(--player);
      }

      .player-mark {
        font-size: 0.65rem;
      }

      .vs-label {
        font-family: 'Oswald', sans-serif;
        color: var(--border);
        font-size: 0.6rem;
        letter-spacing: 0.1em;
      }

      .fight-btn {
        margin-top: 2px;
        padding: 7px 10px;
        font-size: 11px;
      }

      .match-card.pair-gap {
        margin-bottom: 16px;
      }

      /* --- Collapsed card --- */
      .match-card.collapsed {
        padding: 7px 10px;
      }

      .match-summary {
        font-family: 'Inter', sans-serif;
        font-size: 0.72rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
      }

      .match-summary .won  { color: var(--win); }
      .match-summary .lost { color: var(--lose); opacity: 0.6; text-decoration: line-through; }
      .match-summary .defeated { color: var(--muted); font-size: 0.65rem; }
      .match-summary .vs-sep { color: var(--border); }

      /* --- Expanded card appear animation --- */
      @keyframes card-expand {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .match-card.expanded {
        animation: card-expand 0.3s ease;
      }

      /* --- Fight Animations --- */
      @keyframes shake {
        0%, 100% { transform: translateX(0) rotate(0); }
        15%       { transform: translateX(-5px) rotate(-2deg); }
        30%       { transform: translateX(5px)  rotate(2deg); }
        45%       { transform: translateX(-4px) rotate(-1deg); }
        60%       { transform: translateX(4px)  rotate(1deg); }
        75%       { transform: translateX(-2px); }
        90%       { transform: translateX(2px); }
      }

      @keyframes flash-gold {
        0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.4); background: var(--surface); }
        40%       { box-shadow: 0 0 28px rgba(245,158,11,0.8); background: rgba(245,158,11,0.15); }
      }

      @keyframes winner-pop {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      .match-card.fighting {
        animation: shake 0.75s ease, flash-gold 0.75s ease;
        pointer-events: none;
      }

      /* --- Champion / Elimination Banner --- */
      .banner {
        display: none;
        font-family: 'Oswald', sans-serif;
        border-radius: 12px;
        padding: 20px 32px;
        font-size: 1.3rem;
        letter-spacing: 0.04em;
        text-align: center;
        margin-top: 20px;
        width: 100%;
        max-width: 560px;
        box-sizing: border-box;
      }

      .banner.win {
        background: linear-gradient(135deg, #d97706, #f59e0b);
        color: #0e0e12;
        box-shadow: 0 8px 32px rgba(245,158,11,0.4);
      }

      .banner.loss {
        background: rgba(239,68,68,0.1);
        color: var(--muted);
        border: 1px solid rgba(239,68,68,0.3);
      }

      /* --- Misc --- */
      .bottom-bar {
        display: flex;
        gap: 16px;
        margin-top: 16px;
        align-items: center;
      }

      .legend {
        color: var(--muted);
        font-size: 0.75rem;
        font-family: 'Inter', sans-serif;
      }

      @media (max-width: 700px) {
        .dino-grid { grid-template-columns: repeat(2, 1fr); }
        .bracket-columns { flex-wrap: wrap; height: auto; gap: 20px; }
        .round-col { min-width: 45%; }
        .col-inner { gap: 10px; }
      }

    </style>
  </head>

  <body>

    <div class="title">
      <h1>Dino Tournament</h1>
    </div>

    <div class="nav-links">
      <a class="nav-link" href="index.html">← Back to 1v1</a>
    </div>

    <!-- SELECTION PHASE -->
    <div class="selection-card" id="selection-phase">
      <h2>Pick Your 8 Dinosaurs</h2>
      <p>The remaining 8 will be your opponents. No duplicates!</p>
      <div class="dino-grid" id="dino-selects"></div>
      <button class="button" onclick="startTournament()">Start Tournament</button>
    </div>

    <!-- BRACKET PHASE -->
    <div id="bracket-phase">
      <div class="bracket-columns">

        <div class="round-col">
          <div class="round-title">Round 1</div>
          <div class="col-inner" id="round-0"></div>
        </div>

        <div class="round-col">
          <div class="round-title">Quarterfinals</div>
          <div class="col-inner" id="round-1"></div>
        </div>

        <div class="round-col">
          <div class="round-title">Semifinals</div>
          <div class="col-inner" id="round-2"></div>
        </div>

        <div class="round-col">
          <div class="round-title">Final</div>
          <div class="col-inner" id="round-3"></div>
        </div>

      </div>

      <div class="banner" id="champion"></div>

      <div class="bottom-bar">
        <span class="legend">⭐ = your pick</span>
        <button class="button reset" onclick="window.location.reload()">Start Over</button>
      </div>
    </div>

    <script src="bracket.js"></script>

  </body>
</html>
